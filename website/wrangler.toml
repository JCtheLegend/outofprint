name = "out-of-print-press"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]
main = ".open-next/worker.js"

# Non-secret runtime variables live here so they are version controlled and a
# deploy cannot leave them behind. Anything in [vars] REPLACES the plain-text
# variables in the dashboard on every deploy — dashboard Secrets are untouched.
#
# Never put secrets in this file: LULU_CLIENT_SECRET, STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, SUPABASE_SERVICE_ROLE_KEY and RESEND_API_KEY are
# dashboard Secrets. NEXT_PUBLIC_* values belong in the build variables, since
# they are compiled into the bundle rather than read at runtime.

[assets]
directory = ".open-next/assets"
binding = "ASSETS"

[vars]
LULU_API_URL = "https://api.sandbox.lulu.com"
LULU_CLIENT_KEY = "9e9f815c-b683-4d63-95b2-6624f90d6e58"
LULU_CONTACT_EMAIL = "outofprintpress@gmail.com"
LULU_DEFAULT_PHONE = "+1-734-787-7848"
RESEND_FROM_EMAIL = "noreply@outofprintpress.store"
