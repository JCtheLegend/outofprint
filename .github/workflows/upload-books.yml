name: Upload Books to Supabase

on:
  push:
    branches: [main]
    paths:
      - "book-creator/books/**"
  # Lulu revises its print costs now and then; re-price the catalog weekly
  # (Mondays 09:00 UTC) without re-uploading any files.
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:
    inputs:
      book_folder:
        description: "Book folder name under book-creator/books/ to upload (leave blank to upload all)"
        required: false

jobs:
  upload:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        working-directory: book-creator
        run: pip install -r scripts/requirements.txt

      - name: Upload books
        working-directory: book-creator
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Prices come from the production Lulu account's print costs
          LULU_CLIENT_KEY: ${{ secrets.LULU_CLIENT_KEY }}
          LULU_CLIENT_SECRET: ${{ secrets.LULU_CLIENT_SECRET }}
          BOOK_FOLDER: ${{ github.event.inputs.book_folder }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$EVENT_NAME" = "schedule" ]; then
            python scripts/upload_to_supabase.py --price-only
          elif [ -n "$BOOK_FOLDER" ]; then
            python scripts/upload_to_supabase.py "$BOOK_FOLDER"
          else
            python scripts/upload_to_supabase.py
          fi
