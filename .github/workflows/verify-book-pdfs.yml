name: Verify repaired book PDF bytes
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Read back the two corrected private PDFs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python book-creator/scripts/verify_uploaded_book_pdfs.py
      - name: Save hash verification receipt
        uses: actions/upload-artifact@v4
        with:
          name: corrected-book-pdf-hashes
          path: book-pdf-verification.json
          retention-days: 30
